openapi: 3.0.3
info:
  title: Ledger API
  version: 0.1.0
  description: |
    A double-entry ledger service.

    Rules for this contract (see docs/decisions/0018-openapi-contract-first.md):
    - This file is the source of truth. A feature PR updates it with the code.
    - Versioned paths start with `/v1`. Changes inside `/v1` are additive only.
    - Money amounts are integer strings in minor units, for example "150000".
    - Every POST needs an `Idempotency-Key` header.
    - Every error uses the `Error` shape below.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
    description: Liveness and readiness. No authentication.
  - name: Identity
    description: Client identity and authorization.
  - name: Accounts
    description: Immutable account identities.
  - name: Currencies
    description: Allowed ledger currencies.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness. The process is up. It does not touch the database.
      security: []
      responses:
        '200':
          description: The process is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /health/ready:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness. The process can reach the database.
      security: []
      responses:
        '200':
          description: Ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  db:
                    type: string
                    enum: [up]
        '503':
          description: The database is not reachable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/whoami:
    get:
      tags: [Identity]
      operationId: getWhoami
      summary: Return the identity and scopes of the authenticated client.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated client.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, name, scopes]
                properties:
                  client_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                      enum: [ledger:read, ledger:write]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an empty account.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The created account.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Busy'
    get:
      tags: [Accounts]
      operationId: findAccounts
      summary: Find an account by external ID.
      security:
        - bearerAuth: []
      parameters:
        - name: external_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
        - name: client
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{1,39}$'
      responses:
        '200':
          description: Matching account, or an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/accounts/{id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Read an account by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/currencies:
    get:
      tags: [Currencies]
      operationId: listCurrencies
      summary: List allowed currencies.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Allowed currencies sorted by code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A client API key. Created by an operator. Shown once.
  headers:
    RequestId:
      description: A unique ID for this request. Quote it when you report a problem.
      schema:
        type: string
        format: uuid
    IdempotentReplayed:
      description: This response was replayed from the stored idempotent result.
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Retry the request after this many seconds.
      schema:
        type: integer
        enum: [1]
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique string chosen by the client for each new operation.
        Send the same value when you retry the same operation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
  schemas:
    Amount:
      type: string
      pattern: '^[1-9][0-9]{0,17}$'
      description: A positive integer in minor units, as a string. No decimals. No sign.
      example: '150000'
    Currency:
      type: object
      required: [code, minor_exponent]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
        minor_exponent:
          type: integer
          minimum: 0
          maximum: 4
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, kind, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[^\p{Cc}\s](?:[^\p{Cc}]*[^\p{Cc}\s])?$'
        kind:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        allow_negative:
          type: boolean
        external_id:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
    Account:
      type: object
      required:
        [
          id,
          client_id,
          name,
          kind,
          normal_balance,
          currency,
          allow_negative,
          external_id,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        normal_balance:
          type: string
          enum: [debit, credit]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        allow_negative:
          type: boolean
        external_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AccountList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Account'
    CurrencyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: A stable code for programs to read.
              example: insufficient_funds
            message:
              type: string
              description: A short text for people. It never holds internal details.
            request_id:
              type: string
              format: uuid
  responses:
    Unauthorized:
      description: The API key is missing, wrong, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The API key does not have the needed scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The thing does not exist, or this client may not see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state, including idempotency_key_reused.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: The request is valid, but a business rule refuses it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Busy:
      description: The request could not complete because the service was busy.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The request body is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The content type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - bearerAuth: []
