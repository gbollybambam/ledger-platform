name: ledger-ci

# Runs on every pull request. There is no path filter on purpose (see docs/decisions/P-0005).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ledger-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: services/ledger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger_admin
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: ledger_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledger_admin -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_ADMIN_DATABASE_URL: postgres://ledger_admin:change-me@localhost:5433/ledger_test
      TEST_MIGRATION_DATABASE_URL: postgres://ledger_migrator:change-me-migrator@localhost:5433/ledger_test
      TEST_DATABASE_URL: postgres://ledger_app:change-me-app@localhost:5433/ledger_test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: services/ledger/.nvmrc
          cache: npm
          cache-dependency-path: services/ledger/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run openapi:lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build the Docker image
        run: docker build --tag ledger-ci:${{ github.sha }} .
